# აპლიკაციის სერვისები — forge-ზე (ttc/role=compute). images ლოკალურად აიგება და
# კვანძების containerd-ში შემოდის (იხ. README — image distribution). imagePullPolicy: IfNotPresent.
#
# ⚠️ collector double-poll: atlas-ზე ttc-collector systemd უკვე აგროვებს. k3s collector-ის
# გაშვებამდე გააჩერე systemd collector (`sudo systemctl stop ttc-collector`), თორემ TTC API
# ორმაგად იპოლება. ეს collector demo-სთვისაა; durable always-on შეგროვება atlas systemd რჩება.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: ttc
spec:
  replicas: 1
  selector:
    matchLabels: { app: collector }
  template:
    metadata:
      labels: { app: collector }
    spec:
      nodeSelector: { ttc/role: compute }     # forge
      containers:
        - name: collector
          image: ttc-collector:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: DATA_DIR, value: /data }
            - name: KAFKA_BOOTSTRAP
              valueFrom: { configMapKeyRef: { name: ttc-config, key: KAFKA_BOOTSTRAP } }
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: ttc-secret, key: API_KEY } }
          volumeMounts:
            - { name: raw, mountPath: /data }
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "128Mi" }
      volumes:
        - name: raw
          emptyDir: {}      # demo-ში ephemeral; durable JSONL = atlas systemd collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: ttc
spec:
  replicas: 1
  selector:
    matchLabels: { app: ingest }
  template:
    metadata:
      labels: { app: ingest }
    spec:
      nodeSelector: { ttc/role: compute }     # forge
      initContainers:
        - name: wait-deps               # postgres + kafka მზადყოფნის მოლოდინი
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432 && nc -z kafka 9092; do echo waiting; sleep 3; done"]
      containers:
        - name: ingest
          image: ttc-ingest:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: ttc-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ttc-secret, key: POSTGRES_PASSWORD } }
          resources:
            requests: { memory: "96Mi", cpu: "50m" }
            limits:   { memory: "256Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ttc
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      nodeSelector: { ttc/role: compute }     # forge
      containers:
        - name: api
          image: ttc-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: ttc-secret, key: API_KEY } }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ttc
spec:
  type: NodePort
  selector: { app: api }
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500        # წვდომა: http://<ნებისმიერი-კვანძის-ip>:30500/health
