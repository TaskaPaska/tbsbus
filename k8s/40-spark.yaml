# Spark standalone cluster k3s-ზე. master forge-ზე; worker — DaemonSet ყველა ttc/spark=true
# კვანძზე (forge + 2 laptop = 3 worker). feature-job ამ cluster-ზე ნაწილდება (იხ. 50-...job).
#
# შენიშვნა: Spark standalone-ის master/worker DNS registration k8s-ში დელიკატურია — პირველ
# გაშვებაზე შეამოწმე master UI (NodePort 30808): უნდა ჩანდეს 3 Alive Worker. თუ worker ვერ
# რეგისტრირდება, ჩვეულებრივ SPARK_MASTER_HOST / headless DNS-ის საქმეა.
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: ttc
spec:
  clusterIP: None            # headless — pod-ის stable DNS: spark-master.ttc.svc
  selector: { app: spark-master }
  ports:
    - { name: rpc, port: 7077, targetPort: 7077 }
    - { name: ui,  port: 8080, targetPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: spark-ui
  namespace: ttc
spec:
  type: NodePort
  selector: { app: spark-master }
  ports:
    - { port: 8080, targetPort: 8080, nodePort: 30808 }   # http://<node-ip>:30808
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: ttc
spec:
  replicas: 1
  selector:
    matchLabels: { app: spark-master }
  template:
    metadata:
      labels: { app: spark-master }
    spec:
      nodeSelector: { ttc/role: compute }      # forge
      hostname: spark-master                   # bind/advertise stable hostname
      containers:
        - name: spark-master
          image: ttc-spark:latest
          imagePullPolicy: IfNotPresent
          command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
          env:
            - { name: SPARK_MASTER_HOST, value: "spark-master" }
          ports:
            - { containerPort: 7077 }
            - { containerPort: 8080 }
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "768Mi" }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spark-worker
  namespace: ttc
spec:
  selector:
    matchLabels: { app: spark-worker }
  template:
    metadata:
      labels: { app: spark-worker }
    spec:
      nodeSelector: { ttc/spark: "true" }      # forge + laptop-1 + laptop-2 → 3 worker
      containers:
        - name: spark-worker
          image: ttc-spark:latest
          imagePullPolicy: IfNotPresent
          command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
          env:
            - { name: SPARK_WORKER_CORES, value: "2" }
            - { name: SPARK_WORKER_MEMORY, value: "1g" }
          resources:
            requests: { memory: "512Mi", cpu: "150m" }
            limits:   { memory: "1536Mi" }      # 8GB laptop-ისთვის უსაფრთხო
