<header>
  <div class="brand">
    <div class="logo">TBS Bus</div>
    <div class="sub">ავტობუსის პროგნოზი</div>
  </div>
  <div class="ai-pill">✦ AI</div>
</header>

<main>
  <p class="load-error" *ngIf="error && !selected">⚠ {{ error }}</p>

  <app-stop-picker [stops]="stops" (stopSelected)="onStopSelected($event)"></app-stop-picker>

  <app-arrivals [stop]="selected" [arrivals]="arrivals" [loading]="loading" [error]="error"></app-arrivals>
</main>

<footer>
  თბილისის {{ stops.length }} გაჩერება · პროგნოზი მხოლოდ realtime რეისებზე · <strong>დემო</strong>
</footer>
