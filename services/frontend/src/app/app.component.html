<header>
  <h1>თბილისის ავტობუსი</h1>
  <p class="tagline">აირჩიე გაჩერება — მიიღე AI პროგნოზი ჩამოსვლამდე</p>
</header>

<main>
  <p class="load-error" *ngIf="error && !selected">⚠ {{ error }}</p>

  <app-stop-picker [stops]="stops" (stopSelected)="onStopSelected($event)"></app-stop-picker>

  <app-arrivals [stop]="selected" [arrivals]="arrivals" [loading]="loading" [error]="error"></app-arrivals>
</main>

<footer>
  <p>დაფარულია {{ stops.length }} გაჩერება. პროგნოზი მხოლოდ realtime რეისებზე. <strong>დემო / PoC.</strong></p>
</footer>
